name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 本仓 checkout 到仓名目录（跨仓 ProjectReference 解析到同级 <dep>/ 目录）
      - uses: actions/checkout@v4
        with:
          path: aether-trading
      # 跨仓依赖（本地 ProjectReference 拓扑——切 PackageReference 后可移除）
      - uses: actions/checkout@v4
        with:
          repository: AetherAxis/ctp-net-contracts
          path: ctp-net-contracts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # GitHub Packages 私有源凭据（GITHUB_TOKEN 只写进 CI 运行时文件，不入库）。
      # 依赖仓为私有仓时 GITHUB_TOKEN 默认不能跨仓读取——需在 org Settings → Actions →
      # General 开放 accessible repositories，或改用 PAT secret。
      - name: Configure GitHub Packages credentials
        run: >
          dotnet nuget update source github
          --configfile aether-trading/nuget.config
          --username AetherAxis
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      - name: Build
        run: dotnet build aether-trading.slnx -c Release
        working-directory: aether-trading

      # 依赖审计：任何**新出现**的已知漏洞都会让这一步失败。
      # 允许清单只放「上游已停止维护、没有修复版本」的传递依赖，每条写明来历与为何可接受。
      # 当前唯一在册项：DotNetZip 1.16.0（GHSA-xhg6-9j5j-w4vf）——1.16.0 即最后一版，
      # 由 QuantConnect.Compression 传递引入（本仓代码不直接调用）；升级 Lean 或上游换库后应删掉此项。
      - name: NuGet audit
        run: |
          dotnet package list --vulnerable --include-transitive > /tmp/audit.txt
          cat /tmp/audit.txt
          grep -E '^[[:space:]]+> ' /tmp/audit.txt \
            | grep -vi 'GHSA-xhg6-9j5j-w4vf' > /tmp/audit-bad.txt || true
          if [ -s /tmp/audit-bad.txt ]; then
            echo "::error::发现未在允许清单中的已知漏洞依赖："
            cat /tmp/audit-bad.txt
            exit 1
          fi
        working-directory: aether-trading

      # 2026-10-23 迁入测试：99 例 = 指标 / 条件编译 / YAML 策略派发 / Roslyn 编译缓存 / Brokerage 映射与回报翻译（FakeCtpSession 零真实 CTP）。
      # 覆盖率只采集不上门槛（先有趋势再谈门槛，避免把「补测试」变成「改阈值」）。
      - name: Test
        run: dotnet test aether-trading.slnx -c Release --no-build --collect:"XPlat Code Coverage"
        working-directory: aether-trading

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-aether-trading
          path: aether-trading/tests/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
